<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Etch-A-Sketch Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Draw on a grid with mouse, touch or keyboard - a browser etch-a-sketch.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
  </head>
  <body>
    <div class="flex-container">
      <div class="upper-body">
        <h1>Etch-a-Sketch</h1>
      </div>
      <div class="content">
        <canvas id="board" tabindex="0" role="application"
     aria-label="Drawing board. Use the arrow keys to move and Space or Enter to paint."></canvas>
      </div>
      <div class="buttons">
        <label class="visually-hidden" for="modify-grid">Grid size (1-150)</label>
        <input id="modify-grid" type="range" min="1" max="150" value="16" aria-describedby="grid-size-text">
        <p id="grid-size-text" aria-live="polite"></p>
        <button class="tool-button black" data-tool="black" aria-label="Black pen"></button>
        <button class="tool-button white" data-tool="white" aria-label="Eraser"></button>
        <button class="tool-button random" data-tool="random" aria-label="Random Colour"></button>
        <div class="action-buttons">
          <button id="undo" type="button" class="action-button" disabled aria-label="Undo last action (Ctrl+Z)">Undo</button>
          <button id="clear" type="button" class="action-button" aria-label="Clear the whole drawing">Clear</button>
          <button id="export" type="button" class="action-button" aria-label="Save the drawing as a PNG image">Save PNG</button>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="script.js"></script>
</html>
